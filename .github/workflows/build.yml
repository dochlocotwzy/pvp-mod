name: Build mod

on:
  push:
    branches: [ "**" ]
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.5.0'

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          gradle build --no-daemon 2>&1 | tee build_output.log
        continue-on-error: true
        id: build

      - name: Diagnose Minecraft API via javap
        if: steps.build.outcome == 'failure'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          {
            echo "Searching for a jar containing net.minecraft.client.render.entity.EntityRenderer ..."
            FOUND=""
            for j in $(find ~/.gradle/caches/fabric-loom "$GITHUB_WORKSPACE/.gradle" -iname "*.jar" 2>/dev/null); do
              out=$(javap -p -classpath "$j" net.minecraft.client.render.entity.EntityRenderer 2>&1)
              if ! echo "$out" | grep -q "class not found"; then
                echo "=== Found in: $j ==="
                echo "$out"
                echo
                echo "=== EntityRenderState in same jar ==="
                javap -p -classpath "$j" net.minecraft.client.render.entity.state.EntityRenderState 2>&1
                FOUND=1
                break
              fi
            done
            if [ -z "$FOUND" ]; then
              echo "EntityRenderer not found in any jar. All jars searched:"
              find ~/.gradle/caches/fabric-loom "$GITHUB_WORKSPACE/.gradle" -iname "*.jar" 2>/dev/null
            fi
          } > javap_output.txt 2>&1
          exit 0

      - name: Report javap diagnostics as an issue
        if: steps.build.outcome == 'failure'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          if [ -f javap_output.txt ]; then
            {
              echo '```'
              cat javap_output.txt
              echo '```'
            } > javap_issue_body.txt
            gh issue create \
              --title "javap diagnostics: ${GITHUB_SHA}" \
              --body-file javap_issue_body.txt
          fi
          exit 0

      - name: Report build failure as an issue
        if: steps.build.outcome == 'failure'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tail -c 60000 build_output.log > trimmed_log.txt
          {
            echo '```'
            cat trimmed_log.txt
            echo '```'
          } > issue_body.txt
          gh issue create \
            --title "Build failed: ${GITHUB_SHA}" \
            --body-file issue_body.txt

      - name: Fail job if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Start dedicated Minecraft server with the mod
        if: steps.build.outcome == 'success'
        shell: bash
        run: |
          set +e
          mkdir -p server-run
          # Accept Minecraft EULA for this temporary CI-only test server.
          echo "eula=true" > eula.txt
          timeout --signal=INT --kill-after=15s 90s gradle runServer --no-daemon > server-run/server.log 2>&1
          status=$?
          cat server-run/server.log
          if ! grep -q "Done (" server-run/server.log; then
            echo "Dedicated server did not reach the ready state."
            exit 1
          fi
          # timeout's 124/130 are expected after the server has booted; INT asks it to stop.
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ] && [ "$status" -ne 130 ]; then
            echo "Server exited unexpectedly with status $status."
            exit "$status"
          fi

      - name: Upload server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-server-log
          path: server-run/server.log
          if-no-files-found: ignore

      - name: Upload built jar
        uses: actions/upload-artifact@v4
        with:
          name: pvp-traps-jar
          path: build/libs/*.jar
          if-no-files-found: error
