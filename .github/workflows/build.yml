name: Build mod

on:
  push:
    branches: [ "**" ]
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.5.0'

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          gradle build --no-daemon 2>&1 | tee build_output.log
        continue-on-error: true
        id: build

      - name: Diagnose Minecraft API via javap
        if: always()
        shell: bash
        run: |
          set +e
          JAR=$(find ~/.gradle/caches/fabric-loom -iname "*.jar" 2>/dev/null -exec du -b {} \; 2>/dev/null | sort -rn | head -1 | awk '{print $2}')
          {
            echo "Largest jar found in fabric-loom cache: $JAR"
            echo
            if [ -n "$JAR" ]; then
              echo "=== EntityRenderer ==="
              javap -p -classpath "$JAR" net.minecraft.client.render.entity.EntityRenderer 2>&1
              echo
              echo "=== EntityRenderState ==="
              javap -p -classpath "$JAR" net.minecraft.client.render.entity.state.EntityRenderState 2>&1
            else
              echo "No jar found. Full file listing of fabric-loom cache:"
              find ~/.gradle/caches/fabric-loom -iname "*.jar" 2>/dev/null
            fi
          } > javap_output.txt

      - name: Report javap diagnostics as an issue
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo '```'
            cat javap_output.txt
            echo '```'
          } > javap_issue_body.txt
          gh issue create \
            --title "javap diagnostics: ${GITHUB_SHA}" \
            --body-file javap_issue_body.txt

      - name: Report build failure as an issue
        if: steps.build.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tail -c 60000 build_output.log > trimmed_log.txt
          {
            echo '```'
            cat trimmed_log.txt
            echo '```'
          } > issue_body.txt
          gh issue create \
            --title "Build failed: ${GITHUB_SHA}" \
            --body-file issue_body.txt

      - name: Fail job if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Upload built jar
        uses: actions/upload-artifact@v4
        with:
          name: pvp-traps-jar
          path: build/libs/*.jar
          if-no-files-found: error
