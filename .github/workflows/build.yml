name: Build mod

on:
  push:
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.5.0'

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          gradle build --no-daemon 2>&1 | tee build_output.log
        continue-on-error: true
        id: build

      - name: Diagnose Minecraft API via javap
        if: steps.build.outcome == 'failure'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          {
            echo "Searching for a jar containing net.minecraft.client.render.entity.EntityRenderer ..."
            FOUND=""
            for j in $(find ~/.gradle/caches/fabric-loom "$GITHUB_WORKSPACE/.gradle" -iname "*.jar" 2>/dev/null); do
              out=$(javap -p -classpath "$j" net.minecraft.client.render.entity.EntityRenderer 2>&1)
              if ! echo "$out" | grep -q "class not found"; then
                echo "=== Found in: $j ==="
                echo "$out"
                echo
                echo "=== EntityRenderState in same jar ==="
                javap -p -classpath "$j" net.minecraft.client.render.entity.state.EntityRenderState 2>&1
                FOUND=1
                break
              fi
            done
            if [ -z "$FOUND" ]; then
              echo "EntityRenderer not found in any jar. All jars searched:"
              find ~/.gradle/caches/fabric-loom "$GITHUB_WORKSPACE/.gradle" -iname "*.jar" 2>/dev/null
            fi
          } > javap_output.txt 2>&1
          exit 0

      - name: Report javap diagnostics as an issue
        if: steps.build.outcome == 'failure'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          if [ -f javap_output.txt ]; then
            {
              echo '```'
              cat javap_output.txt
              echo '```'
            } > javap_issue_body.txt
            gh issue create \
              --title "javap diagnostics: ${GITHUB_SHA}" \
              --body-file javap_issue_body.txt
          fi
          exit 0

      - name: Report build failure as an issue
        if: steps.build.outcome == 'failure'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tail -c 60000 build_output.log > trimmed_log.txt
          {
            echo '```'
            cat trimmed_log.txt
            echo '```'
          } > issue_body.txt
          gh issue create \
            --title "Build failed: ${GITHUB_SHA}" \
            --body-file issue_body.txt

      - name: Fail job if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Start dedicated Minecraft server and run trap smoke tests
        if: steps.build.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p run server-run
          echo "eula=true" > run/eula.txt

          # Bash coprocess gives the server a real stdin pipe without FIFO
          # open-order deadlocks. The coprocess PID is waitable directly.
          coproc MC_SERVER { gradle runServer --no-daemon > server-run/server.log 2>&1; }
          server_pid="${MC_SERVER_PID:-}"
          server_stdin="${MC_SERVER[1]:-}"
          if [ -z "$server_pid" ] || [ -z "$server_stdin" ]; then
            cat server-run/server.log
            echo "Failed to start the Minecraft server coprocess."
            exit 1
          fi

          cleanup() {
            if [ -n "$server_pid" ] && kill -0 "$server_pid" 2>/dev/null; then
              printf '%s\n' 'stop' >&"$server_stdin" || true
              for i in {1..10}; do
                if ! kill -0 "$server_pid" 2>/dev/null; then break; fi
                sleep 1
              done
              if kill -0 "$server_pid" 2>/dev/null; then
                kill "$server_pid" 2>/dev/null || true
              fi
              wait "$server_pid" || true
            fi
            exec {server_stdin}>&- 2>/dev/null || true
          }
          trap cleanup EXIT

          for i in {1..90}; do
            if grep -q "Done (" server-run/server.log 2>/dev/null; then
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat server-run/server.log
              echo "Dedicated server exited before reaching the ready state."
              exit 1
            fi
            sleep 1
          done

          if ! grep -q "Done (" server-run/server.log; then
            cat server-run/server.log
            echo "Dedicated server did not reach the ready state."
            exit 1
          fi

          for type in spike ice poison electric smoke weakening sticky fire exhaustion; do
            printf '%s\n' "pvptraps test $type 0 64 0" >&"$server_stdin"
            sleep 1
          done

          printf '%s\n' 'stop' >&"$server_stdin"
          exec {server_stdin}>&-
          for i in {1..30}; do
            if ! kill -0 "$server_pid" 2>/dev/null; then break; fi
            sleep 1
          done
          if kill -0 "$server_pid" 2>/dev/null; then
            cat server-run/server.log
            echo "Dedicated server did not stop after the smoke tests."
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" || true
            server_pid=""
            exit 1
          fi
          wait "$server_pid"
          server_pid=""
          cat server-run/server.log

          for type in spike ice poison electric smoke weakening sticky fire exhaustion; do
            if ! grep -q "Trap smoke test triggered: type=$type," server-run/server.log; then
              echo "Trap smoke test failed for type: $type"
              exit 1
            fi
          done
          echo "All nine trap gameplay smoke tests passed."

      - name: Upload server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-server-log
          path: server-run/server.log
          if-no-files-found: ignore

      - name: Upload built jar
        uses: actions/upload-artifact@v4
        with:
          name: pvp-traps-jar
          path: build/libs/*.jar
          if-no-files-found: error
