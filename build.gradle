plugins {
    id 'fabric-loom' version '1.17-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url = "https://maven.shedaniel.me/" } // Cloth Config
    maven { url = "https://maven.terraformersmc.com/releases/" } // Mod Menu
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    modImplementation "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}"

    modImplementation "com.terraformersmc:modmenu:${project.modmenu_version}"
}

processResources {
    inputs.property "version", project.version
    filteringCharset "UTF-8"
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

def generateTrapIcons = tasks.register('generateTrapIcons') {
    inputs.dir(layout.projectDirectory.dir('src/main/icon-data'))
    outputs.dir(layout.buildDirectory.dir('generated/trapIcons'))
    doLast {
        def inputDir = file('src/main/icon-data')
        def outputDir = layout.buildDirectory.dir('generated/trapIcons').get().asFile
        fileTree(inputDir).matching { include '**/*.png.b64' }.each { source ->
            def targetName = source.name.substring(0, source.name.length() - 4)
            def target = new File(outputDir, "assets/pvptraps/textures/item/" + targetName)
            target.parentFile.mkdirs()
            target.bytes = java.util.Base64.getDecoder().decode(source.getText('UTF-8').trim())
        }
    }
}

sourceSets.main.resources.srcDir(layout.buildDirectory.dir('generated/trapIcons'))
tasks.named('processResources').configure {
    dependsOn(generateTrapIcons)
}
tasks.named('sourcesJar').configure {
    dependsOn(generateTrapIcons)
}
