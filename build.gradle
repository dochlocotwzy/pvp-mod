plugins {
    id 'fabric-loom' version '1.17-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = "pvp-mage"
}

repositories {
    maven { url = "https://maven.shedaniel.me/" } // Cloth Config
    maven { url = "https://maven.terraformersmc.com/releases/" } // Mod Menu
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    modImplementation "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}"

    modImplementation "com.terraformersmc:modmenu:${project.modmenu_version}"
}

processResources {
    inputs.property "version", project.version
    filteringCharset "UTF-8"
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

sourceSets.main.resources.srcDir("$buildDir/generated/resources/mageTextures")
sourceSets.main.resources.srcDir("$buildDir/generated/resources/mageNamespace")
sourceSets.main.java.exclude "com/pvptraps/config/ConfigManager.java", "com/pvptraps/config/TrapConfig.java", "com/pvptraps/entity/TrapEntity*.java", "com/pvptraps/util/TrapEffectScheduler.java", "com/pvptraps/util/TrapEffects.java"

tasks.register("prepareMageNamespaceResources", Copy) {
    from("src/main/resources/assets/pvptraps") {
        exclude "textures/**"
        // Trap-only item definitions/models must never ship in the mage namespace.
        exclude "**/*trap*.json", "**/*Trap*.json", "**/trap.json"
    }
    filesMatching("**/*.json") {
        filter { line -> line.replace("pvptraps", "pvpmage") }
    }
    into("$buildDir/generated/resources/mageNamespace/assets/pvpmage")
}
tasks.register("generateMageTextures") {
    def maps = fileTree("tools/textures") { include "*.png.hex"; include "shockwave.txt" }
    inputs.files(maps)
    doLast {
        maps.files.each { f ->
            def l = f.readLines("UTF-8").findAll { it.trim() }
            def p = l[0].split(",").collect { Long.parseUnsignedLong(it.trim(), 16).intValue() }
            def rows = l.drop(1)
            if (rows.size() != 16 || rows.any { it.size() != 16 }) throw new GradleException("Bad texture grid: " + f)
            def im = new java.awt.image.BufferedImage(16, 16, 2)
            rows.eachWithIndex { row, y -> row.eachWithIndex { ch, x -> im.setRGB(x, y, p[Integer.parseInt(ch.toString(), 16)]) } }
            def n = f.name == "shockwave.txt" ? "energy_impulse.png" : f.name.substring(0, f.name.length() - 4)
            def out = file("$buildDir/generated/resources/mageTextures/assets/pvpmage/textures/item/" + n)
            out.parentFile.mkdirs()
            javax.imageio.ImageIO.write(im, "png", out)
        }
    }
}
def mageTextureNames = ["arcane_bolt", "magic_barrier", "flash_of_light", "energy_impulse", "frost_nova", "healing_rune", "smoke_veil", "gale_step", "runic_seal", "blessing", "gravity_sphere", "fireball", "electric_bolt", "ice_wall", "magic_doppelganger", "gust_of_wind", "shadow_veil"]

tasks.register("validateMageTextures") {
    dependsOn("generateMageTextures")
    doLast {
        def parser = new groovy.json.JsonSlurper()
        def generatedDir = file(buildDir.toString() + "/generated/resources/mageTextures/assets/pvpmage/textures/item")
        mageTextureNames.each { name ->
            def modelFile = file("src/main/resources/assets/pvptraps/models/item/" + name + ".json")
            if (!modelFile.isFile()) {
                throw new GradleException("Missing mage item model: " + modelFile)
            }
            def model = parser.parse(modelFile)
            def expected = "pvptraps:item/" + name
            if (model.textures?.layer0 != expected) {
                throw new GradleException("Mage model " + modelFile.name + " must use texture " + expected)
            }
            def sourceTexture = file("src/main/resources/assets/pvptraps/textures/item/" + name + ".png")
            def generatedTexture = new File(generatedDir, name + ".png")
            if (!sourceTexture.isFile() && !generatedTexture.isFile()) {
                throw new GradleException("Missing mage item PNG for " + name)
            }

            def textureFile = sourceTexture.isFile() ? sourceTexture : generatedTexture
            def image = javax.imageio.ImageIO.read(textureFile)
            if (image == null || image.width < 16 || image.height < 16) {
                throw new GradleException("Mage item PNG is invalid or too small: " + textureFile)
            }
            int transparentPixels = 0
            for (int y = 0; y < image.height; y++) {
                for (int x = 0; x < image.width; x++) {
                    if (((image.getRGB(x, y) >>> 24) & 0xFF) == 0) {
                        transparentPixels++
                    }
                }
            }
            int minimumTransparentPixels = (int) Math.ceil(image.width * image.height * 0.25d)
            if (transparentPixels < minimumTransparentPixels) {
                throw new GradleException("Mage item PNG needs a transparent background (at least 25% transparent): " + textureFile)
            }
        }
    }
}

def customItemNames = [
    "magic_barrier", "flash_of_light", "arcane_bolt", "energy_impulse",
    "frost_nova", "healing_rune", "smoke_veil", "gale_step", "runic_seal",
    "blessing", "gravity_sphere", "fireball", "electric_bolt", "ice_wall",
    "magic_doppelganger", "gust_of_wind", "shadow_veil"
]

tasks.register("validateItemDefinitions") {
    doLast {
        def parser = new groovy.json.JsonSlurper()
        customItemNames.each { name ->
            def definitionFile = file("src/main/resources/assets/pvptraps/items/" + name + ".json")
            if (!definitionFile.isFile()) {
                throw new GradleException("Missing 1.21.11 item definition: " + definitionFile)
            }
            def definition = parser.parse(definitionFile)
            def expectedModel = "pvptraps:item/" + name
            if (definition.model?.type != "minecraft:model" || definition.model?.model != expectedModel) {
                throw new GradleException("Item definition " + definitionFile.name + " must reference " + expectedModel)
            }
            def modelFile = file("src/main/resources/assets/pvptraps/models/item/" + name + ".json")
            if (!modelFile.isFile()) {
                throw new GradleException("Missing item model: " + modelFile)
            }
        }
    }
}

tasks.named("processResources") {
    dependsOn("generateMageTextures", "prepareMageNamespaceResources", "validateMageTextures", "validateItemDefinitions")
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

// withSourcesJar() creates this task; configure it only after the Java extension block.
tasks.named("sourcesJar") {
    dependsOn("prepareMageNamespaceResources")
}


// The mage artifact is standalone: exclude legacy trap implementation and assets
// even while the historical combined source tree is being split incrementally.
tasks.named("jar") {
    exclude "com/pvptraps/entity/TrapEntity*.class"
    exclude "com/pvpmage/entity/TrapEntity*.class"
    exclude "com/pvptraps/entity/TrapEntityRenderer*.class"
    exclude "com/pvpmage/entity/TrapEntityRenderer*.class"
    exclude "com/pvptraps/item/TrapItem*.class"
    exclude "com/pvpmage/item/TrapItem*.class"
    exclude "com/pvptraps/config/ConfigManager*.class"
    exclude "com/pvpmage/config/ConfigManager*.class"
    exclude "com/pvptraps/config/TrapConfig*.class"
    exclude "com/pvpmage/config/TrapConfig*.class"
    exclude "com/pvptraps/util/TrapEffectScheduler*.class"
    exclude "com/pvpmage/util/TrapEffectScheduler*.class"
    exclude "com/pvptraps/util/TrapEffects*.class"
    exclude "com/pvpmage/util/TrapEffects*.class"
    exclude "com/pvptraps/command/TrapTestCommand*.class"
    exclude "com/pvpmage/command/TrapTestCommand*.class"
    exclude "assets/pvptraps/**"
    exclude "assets/pvpmage/**/*trap*"
    exclude "assets/pvptraps/**/*Trap*"
    // The mage mod does not own any data under the legacy traps namespace.
    exclude "data/pvptraps/**"
}

tasks.register("verifyMageJarIsolation") {
    dependsOn(tasks.named("jar"))
    doLast {
        def jarFile = tasks.named("jar").get().archiveFile.get().asFile
        def zip = new java.util.zip.ZipFile(jarFile)
        try {
            def entries = Collections.list(zip.entries()).collect { it.name } as Set
            def forbiddenNamespaces = entries.findAll {
                it.startsWith("com/pvptraps/") ||
                it.startsWith("assets/pvptraps/") ||
                it.startsWith("data/pvptraps/")
            }
            if (!forbiddenNamespaces.isEmpty()) {
                throw new GradleException("Mage JAR contains legacy traps namespace entries: " + forbiddenNamespaces.join(", "))
            }

            ["com/pvpmage/PvpTraps.class",
             "com/pvpmage/config/MageConfig.class",
             "com/pvpmage/item/ModItems.class",
             "fabric.mod.json"].each { required ->
                if (!entries.contains(required)) {
                    throw new GradleException("Mage JAR is missing required entry: " + required)
                }
            }

            def trapResources = entries.findAll {
                (it.startsWith("assets/pvpmage/items/") || it.startsWith("assets/pvpmage/models/item/")) &&
                it.toLowerCase(Locale.ROOT).contains("trap")
            }
            if (!trapResources.isEmpty()) {
                throw new GradleException("Mage JAR contains trap-only item resources: " + trapResources.join(", "))
            }

            entries.findAll { it.startsWith("assets/pvpmage/") && it.endsWith(".json") }.each { entryName ->
                def text = zip.getInputStream(zip.getEntry(entryName)).getText("UTF-8")
                if (text.contains("pvptraps:")) {
                    throw new GradleException("Mage resource still references the legacy namespace: " + entryName)
                }
            }

            def metadata = new groovy.json.JsonSlurper().parseText(
                zip.getInputStream(zip.getEntry("fabric.mod.json")).getText("UTF-8"))
            if (metadata.id != "pvpmage") {
                throw new GradleException("Unexpected mage mod id in JAR: " + metadata.id)
            }

            metadata.entrypoints.each { group, definitions ->
                definitions.each { definition ->
                    def className = definition instanceof String ? definition : definition.value
                    def classEntry = className.replace(".", "/") + ".class"
                    if (!entries.contains(classEntry)) {
                        throw new GradleException("Mage entrypoint does not exist in JAR: " + group + " -> " + className)
                    }
                }
            }

            entries.findAll { it.startsWith("assets/pvpmage/items/") && it.endsWith(".json") }.each { entryName ->
                def definition = new groovy.json.JsonSlurper().parseText(
                    zip.getInputStream(zip.getEntry(entryName)).getText("UTF-8"))
                def modelRef = definition.model?.model
                if (modelRef == null) {
                    throw new GradleException("Mage item definition has no model reference: " + entryName)
                }
                def modelParts = modelRef.split(":", 2)
                def modelNamespace = modelParts.length == 2 ? modelParts[0] : "minecraft"
                def modelPath = modelParts.length == 2 ? modelParts[1] : modelParts[0]
                def modelEntry = "assets/" + modelNamespace + "/models/" + modelPath + ".json"
                if (!entries.contains(modelEntry)) {
                    throw new GradleException("Mage item definition references a missing model: " + entryName + " -> " + modelRef)
                }
            }

            entries.findAll { it.startsWith("assets/pvpmage/models/") && it.endsWith(".json") }.each { entryName ->
                def model = new groovy.json.JsonSlurper().parseText(
                    zip.getInputStream(zip.getEntry(entryName)).getText("UTF-8"))
                (model.textures ?: [:]).each { layer, textureRef ->
                    def textureParts = textureRef.toString().split(":", 2)
                    if (textureParts.length == 2 && textureParts[0] == "pvpmage") {
                        def textureEntry = "assets/pvpmage/textures/" + textureParts[1] + ".png"
                        if (!entries.contains(textureEntry)) {
                            throw new GradleException("Mage model references a missing texture: " + entryName + " -> " + textureRef)
                        }
                    }
                }
            }
        } finally {
            zip.close()
        }
    }
}

tasks.named("build") {
    dependsOn("verifyMageJarIsolation")
}
