plugins {
    id 'fabric-loom' version '1.17-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url = "https://maven.shedaniel.me/" } // Cloth Config
    maven { url = "https://maven.terraformersmc.com/releases/" } // Mod Menu
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    modImplementation "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}"

    modImplementation "com.terraformersmc:modmenu:${project.modmenu_version}"
}

processResources {
    inputs.property "version", project.version
    filteringCharset "UTF-8"
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.register("generateMageTextures") {
    def maps = fileTree("tools/textures") { include "*.png.hex"; include "shockwave.txt" }
    inputs.files(maps)
    doLast {
        maps.files.each { f ->
            def l = f.readLines("UTF-8").findAll { it.trim() }
            def p = l[0].split(",").collect { Long.parseUnsignedLong(it.trim(), 16).intValue() }
            def rows = l.drop(1)
            if (rows.size() != 16 || rows.any { it.size() != 16 }) throw new GradleException("Bad texture grid: " + f)
            def im = new java.awt.image.BufferedImage(16, 16, 2)
            rows.eachWithIndex { row, y -> row.eachWithIndex { ch, x -> im.setRGB(x, y, p[Integer.parseInt(ch.toString(), 16)]) } }
            def n = f.name == "shockwave.txt" ? "energy_impulse.png" : f.name.substring(0, f.name.length() - 4)
            def out = file("src/main/resources/assets/pvptraps/textures/item/" + n)
            javax.imageio.ImageIO.write(im, "png", out)
        }
    }
}
tasks.named("processResources") { dependsOn("generateMageTextures") }

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
